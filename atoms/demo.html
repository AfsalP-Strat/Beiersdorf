<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    select {
  -webkit-appearance: none; /* Safari and Chrome */
  -moz-appearance: none; /* Firefox */
  appearance: none;

  background-color: #fff;
  border-radius: 4px;
  padding: 8px 12px;
  font-size: 16px;
  width: 220px;
  text-overflow: ellipsis;

  /* Custom dropdown arrow */
  background-image: url(../assets/images/dwnarrow.png);
  background-repeat: no-repeat;
  background-position: right 8px center;
  option {
    white-space: nowrap;
  }
}
  </style>
</head>
<body>
  <select id="mySelect">
    <option value="option1">This is a short option</option>
    <option value="option2">This is a very long option that needs to be truncated</option>
    <option value="option3">Another short option</option>
  </select>
</body>
</html>
