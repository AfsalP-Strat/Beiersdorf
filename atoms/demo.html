<html lang="en">
<head>

  <title>Document</title>
  <style>
    select {
  width: 180px; /* Adjust the width as needed */
  text-overflow: ellipsis;
}

select option {
  white-space: nowrap;

    <option value="option1">This is a short option</option>

    <option value="option3">Another short option</option>
  </select>
</body>
